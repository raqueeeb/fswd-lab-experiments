<!DOCTYPE html>
<!-- Experiment 05 - Contact Form Validation using Regex & Exception Handling -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Form Validation - Experiment 05</title>
  <link rel="stylesheet" href="style.css">
  <script src="validate.js" defer></script>
</head>
<body>
  <main class="wrapper">
    <h1>Contact Me</h1>
    <p class="hint">The contact form from Experiment 01, now validated with JavaScript.</p>

    <!-- novalidate turns off the browser's built-in checks so our JavaScript does the validation -->
    <form id="contactForm" novalidate>
      <label for="name">Name</label>
      <input type="text" id="name" name="name" placeholder="Ananya Rao" autocomplete="name">
      <span class="error" id="nameError"></span>

      <label for="email">Email</label>
      <input type="text" id="email" name="email" placeholder="you@example.com" autocomplete="email">
      <span class="error" id="emailError"></span>

      <label for="phone">Phone</label>
      <input type="text" id="phone" name="phone" placeholder="10 digit mobile number" autocomplete="tel">
      <span class="error" id="phoneError"></span>

      <label for="message">Message</label>
      <textarea id="message" name="message" rows="4" placeholder="Type your message (at least 10 characters)"></textarea>
      <span class="error" id="messageError"></span>

      <button type="submit" id="submitBtn">Send Message</button>
      <p id="formStatus" role="status"></p>
    </form>
  </main>
</body>
</html>
